server {
    listen 80;
    server_name _;

    root /var/www/html/laravel-docker/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 5m;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @laravel;
    }

    location ^~ /admin/ {
        try_files $uri @laravel;
    }

    location ^~ /unity/ {
        try_files $uri @laravel;
    }

    location ^~ /ajax/ {
        try_files $uri @laravel;
    }

    location ^~ /helpers/ {
        try_files $uri @laravel;
    }

    location = /index.php {
        try_files /__front_controller__ @laravel;
    }

    location = /login.php {
        try_files /__front_controller__ @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/laravel-docker/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/laravel-docker/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass backend:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
