name: Temporary approved Composer security lock refresh

on:
  push:
    branches:
      - security/session-validation-and-av-checks-20261105
    paths:
      - .github/workflows/refresh-composer-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out this trusted security branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
      - name: Set up production PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4.27"
          extensions: gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
      - name: Refresh locked Composer dependencies within declared constraints
        working-directory: laravel-docker
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Audit refreshed production lockfile
        working-directory: laravel-docker
        run: composer audit --locked --no-dev --format=plain
      - name: Execute full PHP regression suite on updated dependencies
        working-directory: laravel-docker
        run: php vendor/bin/phpunit
      - name: Commit only the security-updated lockfile to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- laravel-docker/composer.lock; then
            echo "No composer.lock changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- laravel-docker/composer.lock
          git commit -m "fix(deps): update patched PHP packages and lockfile"
          git push origin "HEAD:security/session-validation-and-av-checks-20261105"
