name: Image upload TOCTOU regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-upload:
    name: PHP upload security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up supported PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4.27"
          extensions: gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
      - name: Install locked PHP dependencies
        working-directory: laravel-docker
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Exercise image upload and race-condition regressions
        working-directory: laravel-docker
        run: vendor/bin/phpunit tests/Feature/ImageUploadServiceTest.php tests/Feature/LocalAntivirusScannerTest.php

  actual-clamav:
    name: ClamAV EICAR detection smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install ClamAV and its signature updater
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
      - name: Update signatures (never silently skip missing databases)
        run: |
          sudo freshclam --stdout
      - name: Scan a harmless file and detect the standard EICAR test string
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/local-av-test"
          cd "$RUNNER_TEMP/local-av-test"
          printf 'harmless data' > clean.bin
          python3 - <<'PY'
          from pathlib import Path
          # EICAR is the standard harmless antivirus test pattern, not malware.
          prefix = "X5O!P%@AP[4\\PZX54(P^)7CC)7}"
          suffix = "$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*"
          Path("eicar-test.bin").write_bytes((prefix + suffix).encode("ascii"))
          PY
          clamscan --no-summary --stdout clean.bin
          set +e
          clamscan --no-summary --stdout eicar-test.bin
          status=$?
          set -e
          test "$status" -eq 1
