name: Security gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${version}_checksums.txt"
          cd "$RUNNER_TEMP"
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks-bin"

      - name: Reject secrets in every reachable commit
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks-bin" git . \
            --log-opts="--all" \
            --redact \
            --no-banner

  policy:
    name: Repository policy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4.27"
          extensions: gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - name: Install PHP dependencies
        working-directory: laravel-docker
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install pinned Node dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository policy
        run: npm run verify

      - name: Run security and regression tests
        working-directory: laravel-docker
        run: php vendor/bin/phpunit
