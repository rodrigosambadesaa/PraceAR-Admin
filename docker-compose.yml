services:
  frontend:
    image: nginx:1.29-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
      - assets_data:/var/www/html/laravel-docker/public/assets:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /var/www/html/laravel-docker
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:${FRONTEND_PORT:-8081}
      APP_KEY: "${APP_KEY:?Set APP_KEY in the environment}"
      APP_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: dbs13217995
      DB_USERNAME: appventurers
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the environment}"
      PASSWORD_PEPPER_CURRENT: "${PASSWORD_PEPPER_CURRENT:?Set PASSWORD_PEPPER_CURRENT in the environment}"
      PASSWORD_PEPPER_LEGACY_JSON: "[]"
      PASSWORD_BREACH_CHECK_ENABLED: "${PASSWORD_BREACH_CHECK_ENABLED:-true}"
      PRACEAR_ADMIN_LOGIN: "${PRACEAR_ADMIN_LOGIN:?Set PRACEAR_ADMIN_LOGIN in the environment}"
      PRACEAR_ADMIN_PASSWORD: "${PRACEAR_ADMIN_PASSWORD:?Set PRACEAR_ADMIN_PASSWORD in the environment}"
      VIRUSTOTAL_REQUIRED: "false"
      PRACEAR_ASSETS_PATH: /var/www/html/laravel-docker/public/assets
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "php-fpm", "-t" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    volumes:
      - assets_data:/var/www/html/laravel-docker/public/assets

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dbs13217995
      MYSQL_USER: appventurers
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the environment}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2.3@sha256:b68f318c5fd85541795ed8eb4ced28ea6908a89910871783b3e479cc6c6d1e1b
    profiles: [ "admin-tools" ]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8083}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
      HIDE_PHP_VERSION: "true"
      UPLOAD_LIMIT: "16M"
      MEMORY_LIMIT: "256M"
      MAX_EXECUTION_TIME: "300"
      TZ: Europe/Madrid
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    tmpfs:
      - /sessions:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=32m
    restart: "no"
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
  assets_data:
